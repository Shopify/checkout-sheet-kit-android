plugins {
    id 'base'
    id 'maven-publish'
    id 'signing'
}

// This is the final publication at the old coordinate. Do not derive these
// versions from the library build or publish an Android component here.
group = 'com.shopify'
version = '4.0.0'

publishing {
    publications {
        relocation(MavenPublication) {
            artifactId = 'checkout-sheet-kit'
            pom {
                name = 'Checkout Sheet Kit (relocated)'
                description = 'Shopify Checkout Sheet Kit has moved to com.shopify:checkout-kit.'
                url = 'https://github.com/Shopify/checkout-kit'
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        name = 'Shopify Inc.'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Shopify/checkout-kit.git'
                    developerConnection = 'scm:git:https://github.com/Shopify/checkout-kit.git'
                    url = 'https://github.com/Shopify/checkout-kit'
                }
                distributionManagement {
                    relocation {
                        groupId = 'com.shopify'
                        artifactId = 'checkout-kit'
                        version = '4.0.0'
                        message = 'Update your dependency to com.shopify:checkout-kit:4.0.0 and follow the 4.0 migration guide. ' +
                            'Future updates are published only under the new coordinate.'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'ossrh-staging-api'
            url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials {
                username = System.getenv('OSSRH_USERNAME')
                password = System.getenv('OSSRH_PASSWORD')
            }
        }
        maven {
            name = 'verification'
            url = layout.buildDirectory.dir('verification-repository')
        }
    }
}

signing {
    useInMemoryPgpKeys(findProperty('signingKeyId'), findProperty('signingKey'), findProperty('signingPassword'))
    required = {
        gradle.taskGraph.allTasks.any {
            it instanceof PublishToMavenRepository && it.repository.name == 'ossrh-staging-api'
        }
    }
    sign publishing.publications.relocation
}

def cleanVerificationRepository = tasks.register('cleanVerificationRepository', Delete) {
    delete layout.buildDirectory.dir('verification-repository')
}

tasks.named('publishRelocationPublicationToVerificationRepository') {
    dependsOn cleanVerificationRepository
}

def verifyRelocation = tasks.register('verifyRelocation') {
    group = 'verification'
    description = 'Publishes locally and verifies the final POM-only relocation.'
    dependsOn 'publishRelocationPublicationToVerificationRepository'
    doLast {
        def repository = layout.buildDirectory.dir('verification-repository').get().asFile
        def pomFile = new File(repository, 'com/shopify/checkout-sheet-kit/4.0.0/checkout-sheet-kit-4.0.0.pom')
        def pom = new groovy.xml.XmlSlurper().parse(pomFile)
        assert pom.groupId.text() == 'com.shopify'
        assert pom.artifactId.text() == 'checkout-sheet-kit'
        assert pom.version.text() == '4.0.0'
        assert pom.packaging.text() in ['', 'pom']
        def relocation = pom.distributionManagement.relocation
        assert relocation.groupId.text() == 'com.shopify'
        assert relocation.artifactId.text() == 'checkout-kit'
        assert relocation.version.text() == '4.0.0'
        assert relocation.message.text().contains('Future updates')
        assert pom.dependencies.children().isEmpty()
        assert !pomFile.text.contains('published-with-gradle-metadata')

        def files = fileTree(pomFile.parentFile).files*.name
        assert files.every {
            it == pomFile.name || it == pomFile.name + '.asc' ||
                it ==~ /checkout-sheet-kit-4\.0\.0\.pom(\.asc)?\.(md5|sha1|sha256|sha512)/
        } : "Unexpected publication files: ${files}"
        assert publishing.publications.relocation.artifacts.empty
        logger.lifecycle('Verified com.shopify:checkout-sheet-kit:4.0.0 -> com.shopify:checkout-kit:4.0.0 (POM only)')
    }
}

// Exercise a Gradle consumer, not just the generated XML. Strip the destination's
// dependencies so this checks the relocation without needing Google Maven.
repositories {
    maven {
        url = layout.buildDirectory.dir('verification-repository')
    }
    mavenCentral()
}

configurations {
    relocationConsumer {
        canBeConsumed = false
    }
}

dependencies {
    relocationConsumer 'com.shopify:checkout-sheet-kit:4.0.0'
    components {
        withModule('com.shopify:checkout-kit') {
            allVariants {
                withDependencies { clear() }
            }
        }
    }
}

def verifyRelocationResolution = tasks.register('verifyRelocationResolution') {
    group = 'verification'
    description = 'Checks that a Gradle consumer of the old coordinate receives the new AAR.'
    dependsOn verifyRelocation
    doLast {
        def artifacts = configurations.relocationConsumer.resolvedConfiguration.resolvedArtifacts
        assert artifacts.size() == 1
        def artifact = artifacts.first()
        assert artifact.moduleVersion.id.group == 'com.shopify'
        assert artifact.name == 'checkout-kit'
        assert artifact.moduleVersion.id.version == '4.0.0'
        assert artifact.extension == 'aar'
        logger.lifecycle('Verified Gradle resolves the old coordinate to checkout-kit-4.0.0.aar')
    }
}

tasks.named('check') {
    dependsOn verifyRelocationResolution
}

tasks.named('publishRelocationPublicationToOssrh-staging-apiRepository') {
    dependsOn 'check'
}
