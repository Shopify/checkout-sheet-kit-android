name: Deploy to Maven Central

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing 3.x.y library patch release tag (optional v prefix)'
        required: true
        type: string

jobs:
  build:
    environment:
      name: Central Repository Deployment

    runs-on: ubuntu-latest
    
    env:
      OSSRH_API_BASE_URL: https://ossrh-staging-api.central.sonatype.com

    steps:
      # Check before checkout: the historical 4.0.0 tag still contains the old selector.
      - name: Reject Retired Relocation Release
        if: contains(fromJSON('["4.0.0", "v4.0.0"]'), github.event.release.tag_name || inputs.tag)
        run: |
          echo "The one-time 4.0.0 relocation is already published; only 3.x maintenance releases are supported." >&2
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Select Publication
        id: publication
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash scripts/release_publication.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install JDK 1.17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 17

      - name: Publish Selected Publication
        run: ./gradlew "$PUBLISH_TASK"
        env:
          PUBLISH_TASK: ${{ steps.publication.outputs.task }}
          CHECKOUT_SHEET_KIT_VERSION: ${{ steps.publication.outputs.version }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Find OSSRH Repository
        id: find-repo
        run: |
          TOKEN=$(echo -n "${{ secrets.OSSRH_USERNAME }}:${{ secrets.OSSRH_PASSWORD }}" | base64)
          RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "${OSSRH_API_BASE_URL}/manual/search/repositories?ip=any&state=open")
          echo "Response: $RESPONSE"

          # Extract repository key from JSON response
          REPO_KEY=$(echo "$RESPONSE" | jq -r \
            '.repositories[] | .key' | head -1)
          echo "Repository key: $REPO_KEY"

          if [ -z "$REPO_KEY" ]; then
            echo "Error: No open repository found"
            exit 1
          fi

          echo "repo_key=$REPO_KEY" >> "$GITHUB_OUTPUT"

      - name: Upload Repository to Central Portal
        run: |
          TOKEN=$(echo -n "${{ secrets.OSSRH_USERNAME }}:${{ secrets.OSSRH_PASSWORD }}" | base64)
          REPO_KEY="${{ steps.find-repo.outputs.repo_key }}"

          echo "Uploading repository: $REPO_KEY"
          curl -v -X POST -H "Authorization: Bearer $TOKEN" \
            "${OSSRH_API_BASE_URL}/manual/upload/repository/$REPO_KEY"

          echo "Upload completed successfully"
